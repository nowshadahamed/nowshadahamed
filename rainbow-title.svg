
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="90"
     viewBox="0 0 1200 90">

  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">

      <stop offset="0%" stop-color="#ff0000">
        <animate attributeName="stop-color"
          values="#ff0000;#ff8c00;#ffff00;#00ff00;#00bfff;#0000ff;#8b00ff;#ff1493;#ff0000"
          dur="6s" repeatCount="indefinite"/>
      </stop>

      <stop offset="25%" stop-color="#ff8c00">
        <animate attributeName="stop-color"
          values="#ff8c00;#ffff00;#00ff00;#00bfff;#0000ff;#8b00ff;#ff1493;#ff0000;#ff8c00"
          dur="6s" repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#00d084">
        <animate attributeName="stop-color"
          values="#00d084;#00bfff;#0000ff;#8b00ff;#ff1493;#ff0000;#ff8c00;#ffff00;#00d084"
          dur="6s" repeatCount="indefinite"/>
      </stop>

      <stop offset="75%" stop-color="#0000ff">
        <animate attributeName="stop-color"
          values="#0000ff;#8b00ff;#ff1493;#ff0000;#ff8c00;#ffff00;#00ff00;#00bfff;#0000ff"
          dur="6s" repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff1493">
        <animate attributeName="stop-color"
          values="#ff1493;#ff0000;#ff8c00;#ffff00;#00ff00;#00bfff;#0000ff;#8b00ff;#ff1493"
          dur="6s" repeatCount="indefinite"/>
      </stop>

    </linearGradient>
  </defs>

  <text x="50%" y="50%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="700"
        fill="url(#rainbow)">
    AI Researcher | Data Analyst | IT Systems &amp; Web Apps Developer
  </text>
</svg>
